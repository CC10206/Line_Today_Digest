services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: todaydigest
      POSTGRES_PASSWORD: todaydigest
      POSTGRES_DB: todaydigest
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todaydigest"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      # .env 的 DATABASE_URL 給本機 `uv run uvicorn` 開發用（host 連 localhost:5432）；
      # 容器之間要用 compose 的服務名稱 `db` 當主機名，這裡覆寫掉。
      DATABASE_URL: postgresql+psycopg://todaydigest:todaydigest@db:5432/todaydigest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Phase 2 (P2)：啟用 `docker compose --profile cache up` 時才會跑
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "6379:6379"

  # Phase 2 (P3)：啟用 `docker compose --profile monitoring up` 時才會跑
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    ports:
      - "9090:9090"

volumes:
  db_data:
