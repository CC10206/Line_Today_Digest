<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" font-family="'Segoe UI', 'Noto Sans TC', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .box-accent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; rx: 10; }
    .box-db { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
    .box-sched { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.5; stroke-dasharray: 4 3; rx: 10; }
    .title { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 12px; fill: #475569; }
    .edge { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .edge-dashed { stroke: #94a3b8; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow-dashed); }
    .edge-label { font-size: 11px; fill: #64748b; }
  </style>

  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">TodayDigest 系統架構 — 1 個 FastAPI 應用、5 個模組群、1 個資料庫</text>

  <!-- RSS 來源 -->
  <rect class="box" x="30" y="70" width="170" height="60"/>
  <text class="title" x="115" y="94" text-anchor="middle">RSS 來源</text>
  <text class="sub" x="115" y="114" text-anchor="middle">中央社 / 自由時報</text>

  <!-- APScheduler -->
  <rect class="box-sched" x="380" y="60" width="220" height="50"/>
  <text class="title" x="490" y="80" text-anchor="middle" font-size="13">APScheduler</text>
  <text class="sub" x="490" y="98" text-anchor="middle">抓取每 30 分 · AI 處理每 60 秒</text>

  <!-- Ingestion -->
  <rect class="box-accent" x="30" y="190" width="170" height="60"/>
  <text class="title" x="115" y="214" text-anchor="middle">Ingestion</text>
  <text class="sub" x="115" y="234" text-anchor="middle">抓取 / 清 HTML / 去重</text>

  <!-- Enrichment -->
  <rect class="box-accent" x="330" y="190" width="200" height="60"/>
  <text class="title" x="430" y="214" text-anchor="middle">Enrichment</text>
  <text class="sub" x="430" y="234" text-anchor="middle">Gemini：摘要 / 分類 / Embedding</text>

  <!-- DB -->
  <rect class="box-db" x="120" y="320" width="340" height="80"/>
  <text class="title" x="290" y="350" text-anchor="middle">PostgreSQL + pgvector</text>
  <text class="sub" x="290" y="370" text-anchor="middle">article（PENDING→ENRICHED）／click_event</text>
  <text class="sub" x="290" y="388" text-anchor="middle">HNSW 向量索引</text>

  <!-- API 模組 -->
  <rect class="box-accent" x="630" y="320" width="220" height="80"/>
  <text class="title" x="740" y="350" text-anchor="middle">API 模組</text>
  <text class="sub" x="740" y="370" text-anchor="middle">article / search / recommendation</text>
  <text class="sub" x="740" y="388" text-anchor="middle">(FastAPI · /docs Swagger UI)</text>

  <!-- Admin API -->
  <rect class="box" x="630" y="470" width="100" height="60"/>
  <text class="title" x="680" y="494" text-anchor="middle" font-size="13">Admin API</text>
  <text class="sub" x="680" y="512" text-anchor="middle">手動觸發 ingest/enrich</text>

  <!-- LINE Bot -->
  <rect class="box" x="750" y="470" width="150" height="60"/>
  <text class="title" x="825" y="494" text-anchor="middle">LINE Bot</text>
  <text class="sub" x="825" y="512" text-anchor="middle">/callback · Flex 卡片</text>

  <!-- LINE 使用者 -->
  <rect class="box" x="780" y="580" width="110" height="60"/>
  <text class="title" x="835" y="604" text-anchor="middle" font-size="13">LINE 使用者</text>
  <text class="sub" x="835" y="622" text-anchor="middle">手機</text>

  <!-- edges -->
  <path class="edge" d="M115,130 V190" />
  <path class="edge" d="M200,220 H330" />
  <path class="edge-dashed" d="M420,110 Q420,150 160,190" />
  <path class="edge-dashed" d="M490,110 V190" />

  <path class="edge" d="M150,250 V320" />
  <path class="edge" d="M400,320 L385,250" />
  <path class="edge" d="M460,250 L445,320" />
  <text class="edge-label" x="330" y="288">PENDING</text>
  <text class="edge-label" x="462" y="288">ENRICHED</text>

  <path class="edge" d="M460,360 H630" />

  <path class="edge" d="M680,400 V470" />
  <path class="edge" d="M825,400 V470" />
  <path class="edge" d="M825,530 V580" />
</svg>
