[project]
name = "today-digest"
version = "0.1.0"
description = "TodayDigest：AI 新聞摘要 + 相關新聞 + LINE Bot（MVP）"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "pgvector",
    "alembic",
    "openai",
    "apscheduler",
    "feedparser",
    "beautifulsoup4",
    "line-bot-sdk>=3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers",
    "ruff",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
